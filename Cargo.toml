[package]
name = "argus"
version = "0.5.0"
edition = "2024"
description = "Capture what AI coding agents actually did — prompts, tool calls, files, hosts and cloud identity — through each tool's native hook/plugin surface, and export it as OTLP/JSON."
license = "Apache-2.0"
repository = "https://github.com/boogy/argus"
readme = "README.md"
keywords = ["observability", "otlp", "telemetry", "security", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.103"
base64 = "0.23"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
ed25519-dalek = "3"
# Request-body gzip. reqwest's own `gzip` feature decompresses *responses*
# only; nothing in it compresses what we send.
flate2 = "1.1.9"
interprocess = { version = "2.4.2", features = ["tokio"] }
regex = "1.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "gzip"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
# Digests for captured file contents. What makes two captures of one path
# comparable, and what lets an excluded file still be reported as touched.
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
toml_edit = "0.25.12"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.4", features = ["v4"] }

# `getuid`, to tell our own endpoint from somebody else's. Already in the tree
# under `interprocess` and `rusqlite`; this only makes the use direct.
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

# This account's SID, so the named pipe's DACL can name it and nothing else.
# Both crates are already in the tree under `interprocess` on Windows; this only
# makes the use direct, and `windows-sys` features are additive, so asking for
# these cannot change what `interprocess` itself compiles.
[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
