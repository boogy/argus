name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # THE RELEASE GATE. Every other job `needs` this one, so a tag that disagrees
  # with Cargo.toml, or that no changelog section describes, fails here,
  # cheaply, before a single binary is built. `cargo metadata --no-deps`
  # resolves nothing and hits no network, so the runner's preinstalled cargo is
  # enough — no toolchain setup needed just to check a version string.
  #
  # This job is also where a tag is classified as a release or a release
  # candidate, once, and handed to the rest of the workflow. Both kinds are
  # expected to work: `vX.Y.Z` publishes as the latest release, `vX.Y.Z-rc.N`
  # publishes as a prerelease of the same version and must never displace it.
  # ---------------------------------------------------------------------------
  setup:
    name: Verify tag matches crate version
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches crate version
        run: make version-check TAG="${GITHUB_REF_NAME}"

      # The release job reads the body out of CHANGELOG.md, and a missing
      # section fails it. Checking here too costs a second and turns that into
      # a ten-second failure instead of one that lands after five builds.
      - name: Verify the changelog describes this tag
        run: make release-notes TAG="${GITHUB_REF_NAME}"

      # Semver spells a prerelease with a hyphen after the patch version, so
      # `v0.2.0-rc.1` is a candidate and `v0.2.0` is not. Decided once here
      # rather than re-evaluated at each use, so the release's prerelease flag
      # and its latest-release flag cannot end up disagreeing.
      - name: Classify the tag
        id: classify
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "${GITHUB_REF_NAME}: prerelease=${prerelease}"

  # ---------------------------------------------------------------------------
  # Build a release binary per platform, natively — no cross-linker anywhere.
  # The musl targets build on ubuntu-latest (amd64) and the GitHub-hosted arm64
  # runner (aarch64), each linking against musl directly. `rusqlite`'s
  # `bundled` feature compiles SQLite from C, so the musl jobs need a musl C
  # toolchain (`musl-tools`) and cc-rs pointed at it via CC_<target>, or the C
  # compile step falls back to glibc's cc and produces a binary that isn't
  # actually static/musl-linked.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            # macos-14 is deprecated (actions/runner-images#13518); macos-15
            # is the current arm64 macOS label.
            runner: macos-15
            archive: tar.gz
          - target: x86_64-apple-darwin
            # macos-13 (the last Intel-only image) has been retired by
            # GitHub; macos-15-intel is the current Intel-Mac runner label.
            runner: macos-15-intel
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      # musl-gcc provides the target C toolchain rusqlite's bundled SQLite
      # build needs. The native-arch runner means no cross-linker is required
      # beyond this — rustc links musl self-contained.
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The only step in this job that runs on every runner, Windows included,
      # so it is the only one that has to name its shell: the default there is
      # PowerShell, which reads `set -euo pipefail` as `Set-Variable -euo` and
      # fails the step before cargo is ever invoked. The steps around it are
      # either guarded to one OS (`if:`) or already pinned to `pwsh`.
      - name: Build binary
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}"

      # Package on Unix: tar.gz containing the binary + README + LICENSE.
      - name: Archive (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          version="${GITHUB_REF_NAME#v}"
          name="argus-${version}-${target}"
          mkdir -p "dist/$name"
          cp "target/$target/release/argus" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          # README.md references assets/*.svg relatively; without them the
          # banner and pipeline diagram are broken links in an unpacked archive.
          cp -R assets "dist/$name/"
          tar -czf "dist/${name}.tar.gz" -C dist "$name"
          ls -l dist

      # Package on Windows: zip containing argus.exe + README + LICENSE.
      # A separate step, not a shared shell script — tar/gzip semantics and
      # PowerShell's Compress-Archive don't share enough to be worth forcing
      # into one code path.
      - name: Archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "${{ matrix.target }}"
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $name = "argus-$version-$target"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/$target/release/argus.exe" "dist/$name/"
          Copy-Item "README.md" "dist/$name/"
          Copy-Item "LICENSE" "dist/$name/"
          # See the unix step: README.md's asset references are relative.
          Copy-Item -Recurse "assets" "dist/$name/"
          # Archive the directory, not its contents, so the zip unpacks to an
          # `argus-<version>-<target>/` folder exactly like the unix tarballs.
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Assemble the GitHub Release from every platform archive: release notes
  # from CHANGELOG.md, one checksums.txt, a cosign keyless signature of it, then
  # the release itself. Provenance is attested over the archives + checksums.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload artifacts
      id-token: write # cosign keyless + provenance OIDC
      attestations: write # actions/attest-build-provenance
    steps:
      # A shallow clone is enough: the release body is read out of the
      # committed CHANGELOG.md, so nothing in this job walks the commit graph.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archives-*
          merge-multiple: true
          path: dist

      # The release body is this tag's section of the committed CHANGELOG.md,
      # not a fresh git-cliff run and not GitHub's auto-generated notes.
      #
      # Not GitHub's: this repo's changes land as direct commits, so a PR-based
      # generator would produce roughly one line for the whole release.
      #
      # Not git-cliff-at-tag-time either, though that is how the changelog is
      # first drafted (`make changelog`, see cliff.toml). Generating here would
      # discard every edit made to the file afterwards — the curated summary at
      # the top of 0.2.0 among them — and publish the raw commit list. Reading
      # the file back means the release page and CHANGELOG.md are the same text
      # by construction, and that what gets published is what was reviewed.
      #
      # `make release-notes` fails the job if the section is missing, rather
      # than publishing an empty body.
      - name: Extract release notes from CHANGELOG.md
        run: make release-notes TAG="${GITHUB_REF_NAME}"

      - name: Checksums + signature
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum argus-* > checksums.txt
          cat checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign v4 defaults to --new-bundle-format: the old --output-signature/
      # --output-certificate flags are ignored and a single --bundle (sig +
      # cert) is written instead. Verify with:
      #   cosign verify-blob --bundle checksums.txt.cosign.bundle \
      #     --certificate-identity-regexp '^https://github.com/boogy/argus/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     checksums.txt
      - name: Sign checksums
        working-directory: dist
        run: |
          set -euo pipefail
          cosign sign-blob \
            --bundle=checksums.txt.cosign.bundle \
            --yes checksums.txt

      # Created as a DRAFT, deliberately, and published by the last step.
      #
      # This repository has immutable releases enabled, which freeze a release
      # at the moment it is published: assets can only be attached before that
      # point. Creating the release published and then uploading — the action's
      # default, and what this workflow did until v0.2.0-rc.1 — leaves a sealed
      # release with zero downloads and fails with "Cannot upload asset ... to
      # an immutable release". Note that a draft *prerelease* also emits
      # release.published rather than release.prereleased when it goes live, so
      # anything subscribing downstream should listen for the former.
      #
      # The body comes from CHANGELOG.md via the step above, so
      # generate_release_notes stays false deliberately.
      - name: Create GitHub Release (draft)
        id: draft_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGES.md
          generate_release_notes: false
          prerelease: ${{ needs.setup.outputs.prerelease }}
          draft: true
          fail_on_unmatched_files: true
          files: dist/*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # Flip the draft live only once every asset is attached and attested, so
      # the immutable snapshot taken at this instant is the complete one.
      #
      # Addressed by release id rather than tag name: a draft release has no
      # published tag ref behind it, so `gh release view <tag>` is not a
      # reliable way to find one.
      # `make_latest` is set explicitly rather than left to the API default,
      # which is "true": a release candidate that quietly became the repo's
      # latest release would be handed to everyone landing on the releases page
      # and to `gh release download` with no version argument.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
          PRERELEASE: ${{ needs.setup.outputs.prerelease }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID" || { echo "no draft release id from the previous step" >&2; exit 1; }
          if [ "$PRERELEASE" = "true" ]; then make_latest=false; else make_latest=true; fi
          echo "publishing ${GITHUB_REF_NAME}: prerelease=${PRERELEASE} make_latest=${make_latest}"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -f make_latest="$make_latest" \
            --jq '"published: " + .html_url + " (prerelease=" + (.prerelease|tostring) + ")"'
